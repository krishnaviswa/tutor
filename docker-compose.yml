# Local Postgres is the TutorOS backend until hosted (README §1).
# Start: docker compose up -d postgres
# App default: DATABASE_URL=postgresql+psycopg://tutor:tutor@127.0.0.1:5432/tutoros
services:
  postgres:
    image: postgres:16-alpine
    container_name: tutoros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutoros
    ports:
      - "5432:5432"
    volumes:
      - tutoros_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutoros"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tutoros_pg:
