<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work log — TutorOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Hanken+Grotesk:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="catalog/hub-chrome.js"></script>
<style>
:root{
  --ground:#F3F6F0; --surface:#FBFCF9; --sunk:#EBEFE6; --raised:#FFFFFF;
  --ink:#182019; --ink-soft:#4C574F; --ink-faint:#7E8A81;
  --line:#D6DCCF; --line-soft:#E4E9DD;
  --accent:#2E7D4F; --accent-ink:#1E5738; --accent-wash:#E4EFE5;
  --amber:#AF6C22; --amber-wash:#F5E9D8;
  --crimson:#A4384A; --crimson-wash:#F3E0E1;
  --sky:#2C6C88; --sky-wash:#DDEAEE;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(24,32,25,.04), 0 12px 34px -12px rgba(24,32,25,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C110E; --surface:#171E19; --sunk:#10150F; --raised:#1E251F;
    --ink:#E6ECE3; --ink-soft:#A4AEA4; --ink-faint:#6C776E;
    --line:#26302A; --line-soft:#1D251F;
    --accent:#5CB57C; --accent-ink:#8CD3A5; --accent-wash:#173224;
    --amber:#D3944F; --amber-wash:#332413;
    --crimson:#D06E7A; --crimson-wash:#331A1E;
    --sky:#6BA7C2; --sky-wash:#122831;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px -14px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
p{margin:0}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.topbar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft)}
.topbar__in{max-width:1200px;margin:0 auto;padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--serif);font-weight:600}
.brand .ph{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 7px;margin-left:8px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs a,.theme-btn,.chip{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:6px 11px
}
.tabs a.on{background:var(--accent-wash);color:var(--accent-ink);border-color:var(--accent);text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 72px}
.lede{color:var(--ink-soft);max-width:68ch;margin:8px 0 18px}
.snow{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:14px 0 28px}
.arm{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);color:inherit;text-decoration:none}
.arm:hover{border-color:var(--ink-faint);text-decoration:none}
.arm h3{font-size:1rem;margin:4px 0}
.arm p{color:var(--ink-soft);font-size:.85rem}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 7px;margin-right:4px}
.tag.pending{background:var(--sunk)}.tag.done{background:var(--accent-wash)}.tag.cp{border-color:var(--amber);color:var(--amber)}
.phase{margin:18px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;color:inherit}
.tile:hover{border-color:var(--accent)}
.tile .id{font-family:var(--mono);font-size:12px;font-weight:600}
.tile .tt{font-size:.82rem;color:var(--ink-soft);margin-top:4px;display:block}
.path{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 20px}
.path button,.path span{font-family:var(--mono);font-size:11px;background:var(--amber-wash);border:1px solid color-mix(in srgb,var(--amber) 40%,var(--line));border-radius:8px;padding:4px 8px;color:inherit}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none;align-items:flex-end;justify-content:center}
.drawer.on{display:flex}
.panel{background:var(--raised);width:min(640px,100%);max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 20px 28px;box-shadow:var(--shadow)}
.kvs{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;font-size:13px;margin-top:12px}
.kvs b{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint)}
.log{border-top:1px solid var(--line-soft);padding:12px 0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
input[type=search]{flex:1;min-width:160px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--raised);color:var(--ink);font:inherit}
.mono{font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<header class="topbar"><div class="topbar__in">
  <div class="brand">TutorOS <span class="ph">product book</span></div>
  
<nav class="tabs">
  <a href="product-viewer.html">Product</a>
  <a href="plan-functional.html">Functional</a>
  <a href="plan-technical.html">Technical</a>
  <a href="plan-sequence.html">Sequence</a>
  <a class="on" href="work-log.html">Work log</a>
</nav>
  <button class="theme-btn" type="button" id="themeBtn">Black</button>
</div></header>
<div class="wrap">
<div class="eyebrow">Arm of the snowflake</div>
<h1>Work log</h1>
<p class="lede">Chronological status. Catalog, demo, and architecture still update in those files. This page only records that it happened. <a href="product-viewer.html">Back to product book</a>.</p>
<div class="filters">
  <input id="q" type="search" placeholder="Filter by T0.1 or text…">
</div>
<div id="list"></div>
</div>
<script>
if(window.TutorOSHub) TutorOSHub.boot({trail:[
  {label:'Product book',href:'product-viewer.html'},
  {label:'Work log'}
]});

const LOGS = [{"date": "2026-09-06", "task": "HUB", "title": "Local backend is Compose Postgres", "body": "Until hosted, FastAPI uses docker-compose.yml Postgres. pytest stays in-memory SQLite. Vendor, AI, and live auth remain mock. README §1 is the agent instruction."}, {"date": "2026-09-06", "task": "HUB", "title": "003 Specified; first HTML guide", "body": "Wrote specs/003-catalog-complete (spec, plan, checklist, analyze, tasks). First plan-viewer suite was documentation only. No /speckit.implement."}, {"date": "2026-09-06", "task": "HUB", "title": "Product book snowflake", "body": "Hub is product-viewer.html. Work log split to work-log.html. Demo, architecture, explorer stay in their files and link back. Task tiles: id, title, status; click for files/tests/commands."}];
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const host=document.getElementById('list'); host.innerHTML='';
  LOGS.slice().reverse().forEach(l=>{
    const hay=(l.task+' '+l.title+' '+l.body).toLowerCase();
    if(q && !hay.includes(q) && l.task.toLowerCase()!==q.replace('#','')) return;
    const d=document.createElement('article'); d.className='log'; d.id=l.task;
    d.innerHTML='<div class="eyebrow">'+l.date+' · '+l.task+'</div><h3>'+l.title+'</h3><p class="lede">'+l.body+
      '</p><p><a href="product-viewer.html#'+ (l.task==='HUB'?'tasks':l.task) +'">Open in product book</a></p>';
    host.appendChild(d);
  });
}
document.getElementById('q').oninput=render;
render();
if(location.hash){
  const id=location.hash.slice(1);
  document.getElementById('q').value=id;
  render();
}

</script>
</body></html>
