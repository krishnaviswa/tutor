<meta charset="utf-8">
<title>TutorOS — Architecture map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="catalog/hub-chrome.js"></script>
<style>
:root{
  --ground:#F3F6F0; --surface:#FBFCF9; --sunk:#EBEFE6; --raised:#FFFFFF;
  --ink:#182019; --ink-soft:#4C574F; --ink-faint:#7E8A81;
  --line:#D6DCCF; --line-soft:#E4E9DD;
  --accent:#2E7D4F; --accent-ink:#1E5738; --accent-wash:#E4EFE5;
  --amber:#AF6C22; --amber-wash:#F5E9D8;
  --crimson:#A4384A; --crimson-wash:#F3E0E1;
  --sky:#2C6C88; --sky-wash:#DDEAEE;
  --violet:#6A4C93; --violet-wash:#E9E2F1;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(24,32,25,.04), 0 12px 34px -12px rgba(24,32,25,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C110E; --surface:#171E19; --sunk:#10150F; --raised:#1E251F;
    --ink:#E6ECE3; --ink-soft:#A4AEA4; --ink-faint:#6C776E;
    --line:#26302A; --line-soft:#1D251F;
    --accent:#5CB57C; --accent-ink:#8CD3A5; --accent-wash:#173224;
    --amber:#D3944F; --amber-wash:#332413;
    --crimson:#D06E7A; --crimson-wash:#331A1E;
    --sky:#6BA7C2; --sky-wash:#122831;
    --violet:#A98FD6; --violet-wash:#241C33;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0C110E; --surface:#171E19; --sunk:#10150F; --raised:#1E251F;
  --ink:#E6ECE3; --ink-soft:#A4AEA4; --ink-faint:#6C776E;
  --line:#26302A; --line-soft:#1D251F;
  --accent:#5CB57C; --accent-ink:#8CD3A5; --accent-wash:#173224;
  --amber:#D3944F; --amber-wash:#332413;
  --crimson:#D06E7A; --crimson-wash:#331A1E;
  --sky:#6BA7C2; --sky-wash:#122831;
  --violet:#A98FD6; --violet-wash:#241C33;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0}
p{margin:0}
button,a.btn{font-family:inherit;cursor:pointer}
.k{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
#top{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;gap:9px;padding:0 12px;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft)}
#top .brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:600;font-size:15px;cursor:pointer;border:0;background:transparent;color:inherit;padding:0}
#top .brand i{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-style:normal;pointer-events:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:31px;padding:0 10px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
#stage{padding:22px 20px 64px;max-width:1100px;margin:0 auto}
.lead{max-width:46rem;color:var(--ink-soft);margin:8px 0 22px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;color:inherit}
.card:hover{border-color:var(--ink-faint)}
.card h3{font-size:1.05rem;margin-bottom:4px}
.card p,.muted{color:var(--ink-soft);font-size:.9rem}
.count{font-family:var(--mono);font-size:11px;color:var(--accent-ink)}
.lane{display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto}
.lane .card{text-align:center}
.arrow{text-align:center;color:var(--ink-faint);font-size:18px}
.crumb{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.crumb a.crumblink,.crumblink{background:none;border:none;padding:0;color:var(--accent-ink);cursor:pointer;font-family:var(--mono);font-size:11px;text-decoration:underline;text-underline-offset:2px}
.crumb .here{color:var(--ink-faint);text-decoration:none;cursor:default}
.crumb .sep{color:var(--line);pointer-events:none}
button.hot:disabled{opacity:.35;cursor:default}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:999px;background:var(--sunk);margin-right:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
a.btn,button.hot{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:8px 12px;color:var(--ink);text-decoration:none;font-size:.85rem}
button.hot.primary,a.btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.call{border-left:3px solid var(--accent);padding:10px 14px;background:var(--surface);margin:10px 0}
.call b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:4px}
.note{background:var(--amber-wash);border-radius:10px;padding:12px 14px;font-size:.88rem;margin:16px 0}
ul.plain{margin:8px 0 0;padding-left:1.1rem;color:var(--ink-soft)}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
.why span{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:3px}
.why p{font-size:.82rem;color:var(--ink-soft);line-height:1.4}
:root[data-theme="light"]{color-scheme:light}
</style>
<header id="top">
  <button type="button" class="brand" id="brandHome" data-goto="start" title="Architecture home">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3c3.5 3 3.5 15 0 18M3.2 9.5h17.6M3.2 14.5h17.6"/></svg>
    TutorOS <i>architecture</i>
  </button>
  <span class="k" id="tlbl" style="margin:0 auto">system map</span>
  <button type="button" class="iconbtn" id="homeBtn" data-goto="start">Architecture home</button>
  <button type="button" class="iconbtn" id="backBtn">Back</button>
  <button type="button" class="iconbtn" id="fwdBtn">Forward</button>
  <a class="iconbtn" href="product-viewer.html" style="display:inline-flex;align-items:center;text-decoration:none">Product book</a>
  <button type="button" class="iconbtn" id="themeBtn">Black</button>
</header>
<main id="stage"></main>
<script src="catalog/embed.js"></script>
<script>
(function(){
if(window.TutorOSHub) TutorOSHub.bindTheme(document.getElementById('themeBtn'));

var C=window.TUTOROS_CATALOG;
if(!C){
  document.getElementById('stage').innerHTML='<p class="lead">Missing catalog/embed.js. Run <code>python scripts/build_catalog.py</code>.</p>';
  if(window.TutorOSHub) TutorOSHub.paintTrail([{label:'Product book',href:'product-viewer.html'},{label:'Architecture home'}]);
  return;
}

var LAYERS=[
  {id:'entry',t:'Entry',d:'Role + workspace. Swimlane roles from the demo: student, faculty, admin, parent, system.'},
  {id:'ui',t:'UI',d:'Closed set of 47 screens (demo S). Demo is UI gold and incomplete. Architecture does not invent ids.'},
  {id:'api',t:'API',d:'FastAPI /api/v1 routers by domain. Planned contracts, not live handlers.'},
  {id:'mw',t:'Middleware',d:'CORS → request id → tenant → authn → authz + flags → QuotaGuard → idempotency → audit.'},
  {id:'svc',t:'Services',d:'No HTTP. TimelinePort, ModuleFlags, SessionRecord.fanout, Notify.dispatch.'},
  {id:'ports',t:'Ports',d:'Google Meet, Teams, SMS, email, storage, two payment ports, push, WhatsApp.'},
  {id:'db',t:'PostgreSQL',d:'workspace_id on every business table. topics/taxonomies, not a syllabus.'}
];
var TENANTS=[
  {id:'coaching',name:'Meridian Coaching',tpl:'Exam-prep',copy:'Sample content may mention a science topic. Biology here is fixture copy, not a module. Faculty starts at cohort/schedule — no staff sign-in on this track.'},
  {id:'lang',name:'Northshore Languages',tpl:'1-on-1',copy:'Same engine: staff sign-in, sessions, assignments, timeline, billing.'},
  {id:'k12',name:'After-school help',tpl:'K-12',copy:'Parent hub: activity, marksheet, results, receipts, teacher chat. Staff and student sign-in both on.'},
  {id:'music',name:'Atelier Strings',tpl:'Music / arts',copy:'Same engine: recitals, guardian view, practice log, staff and student sign-in.'}
];
var ROLES=['student','faculty','admin','parent','system'];
var MW=['CORS allowlist','Request id','Tenant (workspace_id)','AuthN (OTP / magic link / JWT)','AuthZ (role + G1 flag → 404 if module off)','QuotaGuard (warn 80% / block paid send at 100%)','Idempotency on writes','Audit (staff mutations)'];

var state={view:'start',role:null,domain:null,screen:null,layer:null,flow:null};

function screens(){return C.screens;}
function roleOn(s,r){var rs=s.roles||[s.role];return rs.indexOf(r)>=0;}
function byDomain(d){return screens().filter(function(s){return s.domain===d && (!state.role || roleOn(s,state.role));});}
function domains(){
  var order=['A','B','C','D','E','F','G'], out=[];
  order.forEach(function(d){
    var list=screens().filter(function(s){return s.domain===d;});
    out.push({id:d,name:list[0].domainName,n:list.length});
  });
  return out;
}
function findScreen(id){for(var i=0;i<C.screens.length;i++)if(C.screens[i].id===id)return C.screens[i];return null;}
function tourHas(f,id){return f && (f.tour||[]).indexOf(id)>=0;}
function staffLoginNote(){
  var on=[], off=[];
  (C.flows||[]).forEach(function(f){ (tourHas(f,'staff-login')?on:off).push(f.short||f.id); });
  return '<code>staff-login</code> is on '+on.join(', ')+(off.length?'; omitted on '+off.join(', ')+' (faculty starts at cohort/schedule)':'')+'. Sign-in CTAs stay on this template and this role — staff does not open the student app.';
}
function demoScreenHref(sid, tpl){return 'tutor-platform-demo.html#/'+(tpl||'t6')+'/'+sid;}
function roleScreenHref(s, tpl){
  var r=(s.roles&&s.roles[0])||s.role;
  var tid=tpl;
  if(!tid){var f=(C.flows||[]).filter(function(x){return tourHas(x,s.id);})[0]; tid=f?f.id:'t6';}
  return 'tutor-platform-role-'+r+'.html#/'+tid+'/'+s.id;
}

function resetState(){
  state={view:'start',role:null,domain:null,screen:null,layer:null,flow:null};
}
function findFlow(id){var list=C.flows||[];for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null;}
function tourIds(f){return (f&&f.tour&&f.tour.length)?f.tour:(f?f.steps.map(function(st){return st.screen;}):[]);}
function encodeHash(){
  if(state.view==='start')return '#/start';
  if(state.view==='layers')return '#/layers';
  if(state.view==='layer')return '#/layer/'+state.layer;
  if(state.view==='flow')return '#/flow/'+state.flow;
  if(state.view==='ui')return '#/ui'+(state.role?'/'+state.role:'');
  if(state.view==='domain')return '#/ui'+(state.role?'/'+state.role:'')+'/'+state.domain;
  if(state.view==='screen'||state.view==='follow'){
    var tail=(state.view==='follow'?'/call':'');
    if(state.flow)return '#/flow/'+state.flow+'/'+state.screen+tail;
    return '#/ui'+(state.role?'/'+state.role:'')+'/'+(state.domain||'A')+'/'+state.screen+tail;
  }
  return '#/start';
}
function applyHash(){
  var parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  resetState();
  if(!parts.length||parts[0]==='start')return;
  if(parts[0]==='layers'){state.view='layers';return;}
  if(parts[0]==='layer'){state.view='layer';state.layer=parts[1]||'entry';return;}
  if(parts[0]==='flow'){
    state.flow=parts[1]||null;
    if(!parts[2]){state.view='flow';return;}
    state.screen=parts[2];
    var sc=findScreen(state.screen);if(sc)state.domain=sc.domain;
    state.view=parts[3]==='call'?'follow':'screen';
    return;
  }
  if(parts[0]==='ui'){
    var i=1;
    if(parts[i]&&ROLES.indexOf(parts[i])>=0){state.role=parts[i];i++;}
    if(!parts[i]){state.view='ui';return;}
    state.domain=parts[i];
    if(!parts[i+1]){state.view='domain';return;}
    state.screen=parts[i+1];
    state.view=parts[i+2]==='call'?'follow':'screen';
  }
}
function go(view,extra){
  if(view==='start')resetState();
  else{
    state.view=view;
    if(extra){for(var k in extra){if(Object.prototype.hasOwnProperty.call(extra,k))state[k]=extra[k];}}
    if(view==='layers'){state.role=null;state.flow=null;state.screen=null;state.domain=null;state.layer=null;}
    if(view==='layer'){state.flow=null;state.screen=null;state.domain=null;}
    if(view==='ui'){state.flow=null;state.screen=null;state.domain=null;state.layer=null;}
    if(view==='domain'){state.flow=null;state.screen=null;state.layer=null;}
    if(view==='flow'){state.role=null;state.layer=null;state.screen=null;state.domain=null;}
    if((view==='screen'||view==='follow')&&state.screen){
      var s=findScreen(state.screen);if(s&&!state.domain)state.domain=s.domain;
    }
  }
  var h=encodeHash();
  if(location.hash===h){render();return;}
  location.hash=h;
}
function parentGo(){
  if(state.view==='follow'){go('screen');return;}
  if(state.view==='screen'){go(state.flow?'flow':'domain');return;}
  if(state.view==='flow'||state.view==='layers'||state.view==='ui'){go('start');return;}
  if(state.view==='domain'){go('ui');return;}
  if(state.view==='layer'){go('layers');return;}
  go('start');
}
function prefixCrumb(items){
  var out=[{label:'Product book',href:'product-viewer.html'}];
  var rest=(items||[]).filter(function(it){return !(it.view==='start'||it.label==='Home');});
  if(state.view==='start') out.push({label:'Architecture home'});
  else{ out.push({label:'Architecture home',view:'start'}); out=out.concat(rest); }
  return out;
}
function toHubItem(it){
  if(it.href) return {label:it.label,href:it.href};
  if(it.view){
    var x={label:it.label,goto:it.view};
    if(it.role)x.role=it.role;
    if(it.domain)x.domain=it.domain;
    if(it.screen)x.screen=it.screen;
    if(it.layer)x.layer=it.layer;
    if(it.flow)x.flow=it.flow;
    if(it.clearFlow)x.clearFlow=true;
    return x;
  }
  return {label:it.label};
}
function crumb(items){
  var list=prefixCrumb(items);
  if(window.TutorOSHub) TutorOSHub.paintTrail(list.map(toHubItem));
  var h='<div class="crumb">';
  list.forEach(function(it,i){
    if(i)h+='<span class="sep">·</span>';
    if(it.href) h+='<a class="crumblink" href="'+it.href+'">'+it.label+'</a>';
    else if(it.view){
      var a=' type="button" class="crumblink" data-goto="'+it.view+'"';
      if(it.role)a+=' data-role="'+it.role+'"';
      if(it.domain)a+=' data-domain="'+it.domain+'"';
      if(it.screen)a+=' data-screen-id="'+it.screen+'"';
      if(it.layer)a+=' data-layer="'+it.layer+'"';
      if(it.flow)a+=' data-flow="'+it.flow+'"';
      if(it.clearFlow)a+=' data-clear-flow="1"';
      h+='<button'+a+'>'+it.label+'</button>';
    }else h+='<span class="here">'+it.label+'</span>';
  });
  return h+'</div>';
}
function neighborBtns(prev,next){
  var h='<div class="row">';
  h+='<a class="btn" href="product-viewer.html">Product book</a>';
  h+='<button type="button" class="hot" data-goto="start">Architecture home</button>';
  if(prev){
    var pa=' type="button" class="hot" data-goto="'+prev.view+'"';
    if(prev.role)pa+=' data-role="'+prev.role+'"';
    if(prev.domain)pa+=' data-domain="'+prev.domain+'"';
    if(prev.screen)pa+=' data-screen-id="'+prev.screen+'"';
    if(prev.layer)pa+=' data-layer="'+prev.layer+'"';
    if(prev.flow)pa+=' data-flow="'+prev.flow+'"';
    if(prev.clearFlow)pa+=' data-clear-flow="1"';
    h+='<button'+pa+'>← '+prev.label+'</button>';
  }else h+='<button type="button" class="hot" disabled>← Previous</button>';
  if(next){
    var na=' type="button" class="hot primary" data-goto="'+next.view+'"';
    if(next.role)na+=' data-role="'+next.role+'"';
    if(next.domain)na+=' data-domain="'+next.domain+'"';
    if(next.screen)na+=' data-screen-id="'+next.screen+'"';
    if(next.layer)na+=' data-layer="'+next.layer+'"';
    if(next.flow)na+=' data-flow="'+next.flow+'"';
    if(next.clearFlow)na+=' data-clear-flow="1"';
    h+='<button'+na+'>'+next.label+' →</button>';
  }else h+='<button type="button" class="hot" disabled>Next →</button>';
  return h+'</div>';
}
function flowStepNav(sid){
  var f=findFlow(state.flow);if(!f)return neighborBtns(null,null);
  var ids=tourIds(f),i=ids.indexOf(sid);
  var prev=i>0?{view:'screen',screen:ids[i-1],flow:f.id,label:ids[i-1]}:null;
  var next=i>=0&&i<ids.length-1?{view:'screen',screen:ids[i+1],flow:f.id,label:ids[i+1]}:null;
  return neighborBtns(prev,next);
}
function domainStepNav(){
  var list=byDomain(state.domain),i=-1,j;
  for(j=0;j<list.length;j++)if(list[j].id===state.screen)i=j;
  var prev=i>0?{view:'screen',screen:list[i-1].id,domain:state.domain,clearFlow:true,label:list[i-1].title}:null;
  var next=i>=0&&i<list.length-1?{view:'screen',screen:list[i+1].id,domain:state.domain,clearFlow:true,label:list[i+1].title}:null;
  return neighborBtns(prev,next);
}
function layerStepNav(){
  var i=-1,j;
  for(j=0;j<LAYERS.length;j++)if(LAYERS[j].id===state.layer)i=j;
  var prev=i>0?{view:'layer',layer:LAYERS[i-1].id,label:LAYERS[i-1].t}:null;
  var next=i>=0&&i<LAYERS.length-1?{view:'layer',layer:LAYERS[i+1].id,label:LAYERS[i+1].t}:null;
  return neighborBtns(prev,next);
}
function domainListNav(){
  var ds=domains(),i=-1,j;
  for(j=0;j<ds.length;j++)if(ds[j].id===state.domain)i=j;
  var prev=i>0?{view:'domain',domain:ds[i-1].id,role:state.role||undefined,clearFlow:true,label:ds[i-1].id+' '+ds[i-1].name}:null;
  var next=i>=0&&i<ds.length-1?{view:'domain',domain:ds[i+1].id,role:state.role||undefined,clearFlow:true,label:ds[i+1].id+' '+ds[i+1].name}:null;
  return neighborBtns(prev,next);
}
function syncHeader(){
  var home=document.getElementById('homeBtn'), back=document.getElementById('backBtn');
  if(home)home.disabled=state.view==='start';
  if(back)back.disabled=state.view==='start';
}

function startView(){
  var flows=C.flows||[];
  return crumb([])+'<p class="k">Start</p><h1>Someone opens TutorOS</h1>'+
    '<p class="lead">Subject-neutral remote tutoring OS. Same engine for exam-prep, languages, music, skills. Biology / NEET files in this repo are one exam-prep <b>example tenant</b>, not the product.</p>'+
    '<div class="note"><b>Demo is UI gold and incomplete.</b> Screen ids, template steps, and Owner / Who / Why / How / When live in <code>tutor-platform-demo.html</code>. This map reads <code>catalog/embed.js</code> after <code>python scripts/build_catalog.py</code>. '+staffLoginNote()+' Parent hub (<code>parent-home</code>) is activity, marksheet, results, receipts, and teacher chat — own child only; same ids as the demo. Role HTML files are generated children (one lane, no extra features). If this map disagrees with the demo, the demo wins — rebuild catalog, then this page follows.</div>'+
    '<p class="k" style="margin-bottom:8px">Example workspaces (same engine)</p>'+
    '<div class="grid g3">'+TENANTS.map(function(t){
      return '<button type="button" class="card" data-goto="layers"><span class="count">'+t.tpl+'</span><h3>'+t.name+'</h3><p>'+t.copy+'</p></button>';
    }).join('')+'</div>'+
    '<p class="k" style="margin:22px 0 8px">Six template tracks (from demo)</p>'+
    '<div class="grid g2">'+flows.map(function(f){
      return '<button type="button" class="card" data-goto="flow" data-flow="'+f.id+'"><span class="count">'+f.id+' · '+f.tour.length+' screens · '+f.tier+(tourHas(f,'staff-login')?' · staff sign-in':' · no staff sign-in')+(tourHas(f,'parent-home')?' · parent hub':'')+'</span><h3>'+f.name+'</h3><p>'+f.blurb+'</p></button>';
    }).join('')+'</div>'+
    '<p class="k" style="margin:22px 0 8px">Enter as a swimlane role</p>'+
    '<div class="grid g2">'+ROLES.map(function(r){
      return '<button type="button" class="card" data-goto="ui" data-role="'+r+'"><h3>'+r+'</h3><p>Screens this role sits on in demo steps (not chrome-only).</p></button>';
    }).join('')+'</div>'+
    '<div class="row"><button type="button" class="hot primary" data-goto="layers">All layers (architect view)</button>'+
    '<a class="btn" href="tutor-platform-demo.html">Open UI prototype</a></div>'+
    '<p class="muted" style="margin-top:16px">Role children (generated, not linked from the demo chrome): '+
    ['student','faculty','admin','parent','system'].map(function(r){return '<a class="btn" href="tutor-platform-role-'+r+'.html">'+r+'</a>';}).join(' ')+'</p>';
}

function flowTrackView(){
  var f=(C.flows||[]).filter(function(x){return x.id===state.flow;})[0];
  if(!f)return '<p>Unknown template</p>';
  var rows=f.steps.map(function(st,i){
    var s=findScreen(st.screen);
    var why=s&&s.why?s.why:(st.auto||'');
    return '<button type="button" class="card" data-goto="screen" data-screen-id="'+st.screen+'" data-flow="'+f.id+'"><span class="count">'+(st.auto?'auto':'step')+' · '+st.role+' · '+st.stage+'</span><h3>'+(s?s.title:st.screen)+'</h3><p>'+why+'</p></button>';
  }).join('');
  var flows=C.flows||[],fi=-1,k;
  for(k=0;k<flows.length;k++)if(flows[k].id===f.id)fi=k;
  var prevF=fi>0?{view:'flow',flow:flows[fi-1].id,label:flows[fi-1].short||flows[fi-1].id}:null;
  var nextF=fi>=0&&fi<flows.length-1?{view:'flow',flow:flows[fi+1].id,label:flows[fi+1].short||flows[fi+1].id}:null;
  return crumb([{label:'Home',view:'start'},{label:f.name}])+neighborBtns(prevF,nextF)+'<h1>'+f.name+'</h1>'+
    '<p class="lead">'+f.blurb+' · '+f.shape+' · tier '+f.tier+'. Same ids as the demo swimlane. Staff sign-in: '+(tourHas(f,'staff-login')?'on this track':'omitted')+'. Parent hub: '+(tourHas(f,'parent-home')?'on this track':'off')+'.</p>'+
    '<div class="grid g2">'+rows+'</div>'+
    '<div class="row"><a class="btn primary" href="tutor-platform-demo.html#/'+f.id+'/flow">Open this flow in the demo</a>'+
    (tourHas(f,'staff-login')?'<a class="btn" href="tutor-platform-role-faculty.html#/'+f.id+'/staff-login">Faculty · staff sign-in</a>':'')+
    (tourHas(f,'student-login')?'<a class="btn" href="tutor-platform-role-student.html#/'+f.id+'/student-login">Student · sign-in</a>':'')+
    (tourHas(f,'parent-home')?'<a class="btn" href="tutor-platform-role-parent.html#/'+f.id+'/parent-home">Parent hub</a>':'')+
    '</div>';
}

function layersView(){
  var h=crumb([{label:'Home',view:'start'},{label:'Layers'}])+'<h1>Request path</h1><p class="lead">Click a layer. From UI you drill into 47 screens. Home returns to Start. Back is one step up. Previous / Next walks a track, a domain, or these layers.</p><div class="lane">';
  LAYERS.forEach(function(L,i){
    h+='<button type="button" class="card" data-goto="layer" data-layer="'+L.id+'"><span class="k">'+String(i+1).padStart(2,'0')+'</span><h3>'+L.t+'</h3><p>'+L.d+'</p></button>';
    if(i<LAYERS.length-1)h+='<div class="arrow">↓</div>';
  });
  return h+'</div>';
}

function layerView(){
  var L=LAYERS.filter(function(x){return x.id===state.layer;})[0];
  if(!L)return '<p>Unknown layer</p>'+neighborBtns(null,null);
  var extra='';
  if(state.layer==='ui') extra='<div class="row"><button type="button" class="hot primary" data-goto="ui">Open 47 screens by domain</button></div>';
  if(state.layer==='mw') extra='<ul class="plain">'+MW.map(function(m){return '<li>'+m+'</li>';}).join('')+'</ul>';
  if(state.layer==='ports') extra='<ul class="plain">'+C.ports.map(function(p){return '<li><code>'+p.id+'</code> · '+p.env+' default <code>'+p.default+'</code>'+(p.roles?' · WhatsApp roles: '+p.roles.join(', ')+'; student default '+p.studentDefault:'')+'</li>';}).join('')+'</ul>';
  var laterEnt=C.entities.filter(function(e){return e.tier==='later';});
  if(state.layer==='db') extra='<ul class="plain">'+C.entities.filter(function(e){return e.tier==='spine';}).map(function(e){return '<li><code>'+e.id+'</code></li>';}).join('')+'</ul>'+(laterEnt.length?'<p class="muted" style="margin-top:8px">Later: '+laterEnt.map(function(e){return e.id;}).join(', ')+'</p>':'');
  if(state.layer==='api') extra='<p class="muted">'+C.apis.length+' catalog routes (sim). Open a screen card to see the ones it uses.</p>';
  if(state.layer==='svc') extra='<ul class="plain"><li>TimelinePort.append</li><li>ModuleFlags.ensure</li><li>SessionRecord.fanout</li><li>Notify.dispatch (teacher, parent, admin; student if enabled)</li><li>QuotaGuard.check</li></ul>';
  if(state.layer==='entry') extra='<div class="row">'+ROLES.map(function(r){return '<button type="button" class="hot" data-goto="ui" data-role="'+r+'">'+r+'</button>';}).join('')+'</div>';
  return crumb([{label:'Home',view:'start'},{label:'Layers',view:'layers'},{label:L.t}])+layerStepNav()+'<h1>'+L.t+'</h1><p class="lead">'+L.d+'</p>'+extra;
}

function uiView(){
  var filter=state.role?' · role '+state.role:'';
  return crumb([{label:'Home',view:'start'},{label:'UI'+filter}])+'<h1>UI · seven domains</h1>'+
    '<p class="lead">47 screens from demo <code>S</code>. Role filter uses swimlane steps (a screen can appear as student and as system). Chrome (appnav, sidebars) is not extra screens.</p>'+
    '<div class="grid g2">'+domains().map(function(d){
      var n=byDomain(d.id).length;
      return '<button type="button" class="card" data-goto="domain" data-domain="'+d.id+'"'+(state.role?' data-role="'+state.role+'"':'')+' data-clear-flow="1"><span class="count">'+d.id+' · '+n+' screens</span><h3>'+d.name+'</h3></button>';
    }).join('')+'</div>';
}

function domainView(){
  var list=byDomain(state.domain);
  var name=list[0]?list[0].domainName:state.domain;
  return crumb([{label:'Home',view:'start'},{label:'UI',view:'ui',role:state.role||undefined},{label:name}])+domainListNav()+'<h1>'+state.domain+' · '+name+'</h1>'+
    '<p class="lead">'+list.length+' screens'+(state.role?' for '+state.role:'')+'.</p>'+
    '<div class="grid g2">'+list.map(function(s){
      return '<button type="button" class="card" data-screen="'+s.id+'" data-goto="screen" data-screen-id="'+s.id+'" data-clear-flow="1"'+(state.role?' data-role="'+state.role+'"':'')+' data-domain="'+state.domain+'"><span class="count">'+s.module+' · '+s.role+' · '+s.frame+'</span><h3>'+s.title+'</h3><p>'+s.shows+'</p></button>';
    }).join('')+'</div>';
}

function whyBlock(s){
  if(!s.who&&!s.why)return '';
  return '<div class="why">'+
    [['Owner',s.own],['Who',s.who],['Why',s.why],['How',s.how],['When',s.when]].map(function(p){
      return '<div><span>'+p[0]+'</span><p>'+(p[1]||'—')+'</p></div>';
    }).join('')+'</div>';
}
function screenView(){
  var s=findScreen(state.screen);
  if(!s)return '<p>Unknown screen</p>';
  var trail=state.flow
    ?[{label:'Home',view:'start'},{label:(findFlow(state.flow)||{}).name||state.flow,view:'flow',flow:state.flow},{label:s.title}]
    :[{label:'Home',view:'start'},{label:'UI',view:'ui',role:state.role||undefined},{label:s.domainName,view:'domain',domain:s.domain,role:state.role||undefined,clearFlow:true},{label:s.title}];
  var steps=state.flow?flowStepNav(s.id):domainStepNav();
  return crumb(trail)+steps+'<span class="pill" data-screen="'+s.id+'">'+s.id+'</span>'+
    '<span class="pill">'+s.module+'</span><span class="pill">phase '+s.phase+'</span><span class="pill">'+s.status+'</span>'+
    '<span class="pill">lanes '+(s.roles||[s.role]).join(', ')+'</span>'+
    '<h1 style="margin-top:10px">'+s.title+'</h1>'+
    '<p class="lead">'+s.shows+'</p>'+
    whyBlock(s)+
    '<p class="muted">Route <code>'+s.route+'</code> · chrome role '+s.role+' · frame '+s.frame+'</p>'+
    '<div class="call"><b>Shows</b>'+s.shows+'</div>'+
    '<div class="call"><b>APIs</b>'+(s.apis.length?s.apis.map(function(a){return '<div><code>'+a+'</code></div>';}).join(''):'None')+'</div>'+
    '<div class="call"><b>Entities</b>'+(s.entities.length?s.entities.map(function(e){return '<code>'+e+'</code> ';}).join(''):'—')+'</div>'+
    '<div class="call"><b>Ports</b>'+(s.ports.length?s.ports.map(function(e){return '<code>'+e+'</code> ';}).join(''):'none')+'</div>'+
    '<div class="call"><b>Timeline events</b>'+(s.timelineEvents.length?s.timelineEvents.join(', '):'—')+'</div>'+
    '<div class="row"><button type="button" class="hot primary" data-goto="follow"'+(state.flow?' data-flow="'+state.flow+'"':'')+'>Follow the call</button>'+
    '<a class="btn" href="'+demoScreenHref(s.id)+'">Open in demo (Everything)</a>'+
    '<a class="btn" href="'+roleScreenHref(s)+'">Open role child</a></div>';
}

function followView(){
  var s=findScreen(state.screen);
  if(!s)return '<p>Unknown screen</p>';
  var trail=state.flow
    ?[{label:'Home',view:'start'},{label:(findFlow(state.flow)||{}).name||state.flow,view:'flow',flow:state.flow},{label:s.title,view:'screen',screen:s.id,flow:state.flow},{label:'API'}]
    :[{label:'Home',view:'start'},{label:'UI',view:'ui',role:state.role||undefined},{label:s.domainName,view:'domain',domain:s.domain,role:state.role||undefined,clearFlow:true},{label:s.title,view:'screen',screen:s.id,clearFlow:true,domain:s.domain,role:state.role||undefined},{label:'API'}];
  return crumb(trail)+(state.flow?flowStepNav(s.id):domainStepNav())+'<h1>Follow the call</h1>'+
    '<p class="lead">Teaching writes the ledger first. Paid channels run through QuotaGuard. Why this screen exists is copied from the demo.</p>'+
    whyBlock(s)+
    '<div class="lane">'+
    '<div class="card"><span class="k">01 UI</span><h3>'+s.title+'</h3><p>'+s.route+'</p></div><div class="arrow">↓</div>'+
    '<div class="card"><span class="k">02 API</span><h3>Routers</h3><p>'+(s.apis.join(' · ')||'—')+'</p></div><div class="arrow">↓</div>'+
    '<div class="card"><span class="k">03 Middleware</span><h3>Tenant · Auth · Flags · QuotaGuard</h3><p>Missing module → 404. At 100% block, skip the paid send; timeline still writes.</p></div><div class="arrow">↓</div>'+
    '<div class="card"><span class="k">04 Service</span><h3>No HTTP</h3><p>Notify.dispatch to teacher, parent, admin (student if owner-enabled). TimelinePort.append.</p></div><div class="arrow">↓</div>'+
    '<div class="card"><span class="k">05 Ports / DB</span><h3>'+(s.ports.join(', ')||'PostgreSQL only')+'</h3><p>Entities: '+(s.entities.join(', ')||'—')+'</p></div>'+
    '</div>';
}

function render(){
  var stage=document.getElementById('stage'), lbl=document.getElementById('tlbl');
  var html='';
  if(state.view==='start'){lbl.textContent='entry';html=startView();}
  else if(state.view==='flow'){lbl.textContent=state.flow;html=flowTrackView();}
  else if(state.view==='layers'){lbl.textContent='layers';html=layersView();}
  else if(state.view==='layer'){lbl.textContent=state.layer;html=layerView();}
  else if(state.view==='ui'){lbl.textContent='ui';html=uiView();}
  else if(state.view==='domain'){lbl.textContent='domain '+state.domain;html=domainView();}
  else if(state.view==='screen'){lbl.textContent=state.screen;html=screenView();}
  else if(state.view==='follow'){lbl.textContent='call';html=followView();}
  stage.innerHTML=html;
  syncHeader();
  window.scrollTo(0,0);
}

function extraFrom(g){
  var extra={};
  if(g.getAttribute('data-role'))extra.role=g.getAttribute('data-role');
  if(g.getAttribute('data-domain'))extra.domain=g.getAttribute('data-domain');
  if(g.getAttribute('data-screen-id'))extra.screen=g.getAttribute('data-screen-id');
  if(g.getAttribute('data-layer'))extra.layer=g.getAttribute('data-layer');
  if(g.hasAttribute('data-flow'))extra.flow=g.getAttribute('data-flow');
  else if(g.hasAttribute('data-clear-flow'))extra.flow=null;
  else if(g.getAttribute('data-goto')==='screen'&&!g.hasAttribute('data-flow'))extra.flow=null;
  return extra;
}

document.getElementById('backBtn').addEventListener('click',function(e){
  e.preventDefault();
  parentGo();
});
document.getElementById('fwdBtn').addEventListener('click',function(e){
  e.preventDefault();
  history.forward();
});
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-goto]');
  if(!g||g.disabled)return;
  e.preventDefault();
  go(g.getAttribute('data-goto'),extraFrom(g));
});
window.addEventListener('hashchange',function(){
  if(!location.hash||location.hash==='#'){location.replace('#/start');return;}
  applyHash();
  render();
});
if(!location.hash||location.hash==='#')location.replace('#/start');
else{applyHash();render();}
})();
</script>
