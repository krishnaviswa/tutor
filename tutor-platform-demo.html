<meta charset="utf-8">
<title>TutorOS — Template Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#F3F6F0; --surface:#FBFCF9; --sunk:#EBEFE6; --raised:#FFFFFF;
  --ink:#182019; --ink-soft:#3D4640; --ink-faint:#5C675F;
  --line:#D6DCCF; --line-soft:#E4E9DD;
  --accent:#2E7D4F; --accent-ink:#1E5738; --accent-wash:#E4EFE5;
  --amber:#AF6C22; --amber-wash:#F5E9D8;
  --crimson:#A4384A; --crimson-wash:#F3E0E1;
  --sky:#2C6C88; --sky-wash:#DDEAEE;
  --violet:#6A4C93; --violet-wash:#E9E2F1;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(24,32,25,.04), 0 12px 34px -12px rgba(24,32,25,.18);
  --tint:var(--accent); --tint-wash:var(--accent-wash);
  --on-tint:#182019;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C110E; --surface:#171E19; --sunk:#10150F; --raised:#1E251F;
    --ink:#E6ECE3; --ink-soft:#A4AEA4; --ink-faint:#6C776E;
    --line:#26302A; --line-soft:#1D251F;
    --accent:#5CB57C; --accent-ink:#8CD3A5; --accent-wash:#173224;
    --amber:#D3944F; --amber-wash:#332413;
    --crimson:#D06E7A; --crimson-wash:#331A1E;
    --sky:#6BA7C2; --sky-wash:#122831;
    --violet:#A98FD6; --violet-wash:#241C33;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px -14px rgba(0,0,0,.6);
    --on-tint:#0c130e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0C110E; --surface:#171E19; --sunk:#10150F; --raised:#1E251F;
  --ink:#E6ECE3; --ink-soft:#A4AEA4; --ink-faint:#6C776E;
  --line:#26302A; --line-soft:#1D251F;
  --accent:#5CB57C; --accent-ink:#8CD3A5; --accent-wash:#173224;
  --amber:#D3944F; --amber-wash:#332413;
  --crimson:#D06E7A; --crimson-wash:#331A1E;
  --sky:#6BA7C2; --sky-wash:#122831;
  --violet:#A98FD6; --violet-wash:#241C33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px -14px rgba(0,0,0,.6);
  --on-tint:#0c130e;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --ground:#F3F6F0; --surface:#FBFCF9; --sunk:#EBEFE6; --raised:#FFFFFF;
  --ink:#182019; --ink-soft:#3D4640; --ink-faint:#5C675F;
  --line:#D6DCCF; --line-soft:#E4E9DD;
  --accent:#2E7D4F; --accent-ink:#1E5738; --accent-wash:#E4EFE5;
  --amber:#AF6C22; --amber-wash:#F5E9D8;
  --crimson:#A4384A; --crimson-wash:#F3E0E1;
  --sky:#2C6C88; --sky-wash:#DDEAEE;
  --violet:#6A4C93; --violet-wash:#E9E2F1;
  --shadow:0 1px 2px rgba(24,32,25,.04), 0 12px 34px -12px rgba(24,32,25,.18);
  --on-tint:#182019;
  color-scheme:light;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;}
p{margin:0;}
button{font-family:inherit;}
::selection{background:var(--accent-wash);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}
.k{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;gap:9px;padding:0 12px;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);}
#top .brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:600;font-size:15px;cursor:pointer;flex:none;}
#top .brand svg{width:19px;height:19px;}
#top .brand i{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-style:normal;cursor:pointer;}
.burger{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex:none;}
.tplsel{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:31px;font-family:var(--mono);font-size:10px;color:var(--ink-soft);padding:0 6px;max-width:160px;flex:none;}
.tnav{display:flex;align-items:center;gap:8px;margin:0 auto;font-family:var(--mono);font-size:11px;color:var(--ink-soft);}
.tnav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:26px;height:26px;cursor:pointer;color:var(--ink-soft);}
.tnav button:disabled{opacity:.35;cursor:default;}
.tnav .lbl{min-width:170px;text-align:center;}
.right{display:flex;align-items:center;gap:7px;flex:none;}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:31px;padding:0 10px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;}
.iconbtn:hover{border-color:var(--ink-faint);color:var(--ink);}
.iconbtn.on{background:var(--accent-wash);color:var(--accent-ink);border-color:transparent;}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;}
.seg button{border:0;background:var(--surface);padding:0 10px;height:31px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);cursor:pointer;}
.seg button.on{background:var(--ink);color:var(--ground);}
@media(max-width:960px){.tnav .lbl{display:none;}.iconbtn .lbl{display:none;}.iconbtn{padding:0 8px;}.tplsel{max-width:118px;}}

/* ---------- drawer ---------- */
#drawer{position:fixed;top:0;left:0;bottom:0;width:320px;max-width:88vw;background:var(--surface);border-right:1px solid var(--line);z-index:60;transform:translateX(-103%);transition:transform .22s ease;overflow-y:auto;padding:16px 14px 40px;}
#drawer.open{transform:none;}
#drawer .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
#drawer .dh b{font-family:var(--serif);font-size:1rem;}
#scrim{position:fixed;inset:0;background:rgba(10,14,11,.36);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s;}
#scrim.open{opacity:1;pointer-events:auto;}
.draw__grp{margin-bottom:13px;}
.draw__grp h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 5px;display:flex;gap:7px;align-items:center;}
.draw__grp h4 i{width:17px;height:17px;border-radius:5px;background:var(--tint-wash);color:var(--tint);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;font-weight:700;}
.draw a{display:block;padding:7px 9px;border-radius:8px;font-size:.85rem;color:var(--ink-soft);cursor:pointer;}
.draw a:hover{background:var(--sunk);}
.draw a.on{background:var(--tint-wash);color:var(--tint);font-weight:600;}
.draw a small{display:block;font-size:.7rem;color:var(--ink-faint);font-weight:400;}

/* ---------- stage + device ---------- */
#stage{padding:22px 20px 64px;max-width:1240px;margin:0 auto;}
@media(max-width:560px){#stage{padding:14px 9px 48px;}}
.dev{margin:0 auto;background:var(--raised);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-width:100%;}
.dev--web{max-width:1180px;}
.dev--phone{max-width:406px;border-radius:42px;padding:10px;background:#0d120f;border-color:#0d120f;}
.dev__bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line-soft);}
.dev__dots{display:flex;gap:6px;}
.dev__dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block;}
.dev__url{flex:1;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);background:var(--ground);border:1px solid var(--line-soft);border-radius:999px;padding:3px 12px;text-align:center;max-width:380px;margin:0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dev__scr{background:var(--ground);height:min(660px,82vh);overflow-y:auto;overflow-x:hidden;position:relative;}
.dev--phone .dev__scr{height:min(620px,80vh);}
@media(max-width:560px){.dev__scr{height:min(600px,78vh);}}
.phonewrap{min-height:100%;display:flex;flex-direction:column;}
.phonewrap>.appwrap{flex:1 0 auto;}
.pstat{display:flex;align-items:center;justify-content:space-between;padding:9px 22px 8px;font-family:var(--mono);font-size:10px;color:var(--ink-soft);background:var(--surface);}
.dev--phone .pstat{border-radius:30px 30px 0 0;}
.dev--phone .flowbar{border-radius:0 0 30px 30px;}

/* tint hooks */
.tint-amber{--tint:var(--amber);--tint-wash:var(--amber-wash);}
.tint-accent{--tint:var(--accent);--tint-wash:var(--accent-wash);}
.tint-sky{--tint:var(--sky);--tint-wash:var(--sky-wash);}
.tint-violet{--tint:var(--violet);--tint-wash:var(--violet-wash);}
.tint-crimson{--tint:var(--crimson);--tint-wash:var(--crimson-wash);}
.tint-mute{--tint:var(--ink-faint);--tint-wash:var(--sunk);}
.tint-ink{--tint:var(--ink);--tint-wash:var(--sunk);}

/* ---------- app chrome (phone) ---------- */
.appbar{display:flex;align-items:center;gap:10px;padding:15px 16px 12px;background:var(--tint-wash);}
.appbar h2{font-size:1.1rem;flex:1;}
.appwrap{padding:14px 16px 6px;}
.appnav{display:flex;background:var(--surface);border-top:1px solid var(--line);}
.appnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;font-family:var(--mono);font-size:7.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);cursor:pointer;}
.appnav a.on{color:var(--tint);}
.appnav svg{width:17px;height:17px;}

/* ---------- console chrome (web) ---------- */
.cons{display:grid;grid-template-columns:198px 1fr;min-height:520px;}
.cons__side{background:var(--surface);border-right:1px solid var(--line-soft);padding:14px 10px;display:flex;flex-direction:column;gap:2px;}
.cons__side a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:.83rem;color:var(--ink-soft);cursor:pointer;}
.cons__side a:hover{background:var(--sunk);}
.cons__side a.on{background:var(--tint-wash);color:var(--tint);font-weight:600;}
.cons__side svg{width:15px;height:15px;flex:none;}
.cons__main{padding:20px 22px;min-width:0;}
.cons__main>h2{font-size:1.3rem;margin-bottom:3px;}
.cons__main>.k{margin-bottom:16px;display:block;}
.dev--phone .cons{grid-template-columns:1fr;}
.dev--phone .cons__side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line-soft);padding:8px;}
.dev--phone .cons__side a span{display:none;}
.dev--phone .cons__main{padding:14px;}

/* ---------- setup chrome ---------- */
.suphead{padding:16px 22px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);}
.wm{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:600;}
.wm i{font-family:var(--mono);font-size:7.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-style:normal;}
.steps{font-family:var(--mono);font-size:10px;color:var(--ink-faint);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.steps .on{color:var(--tint);font-weight:600;}
.steps .done{color:var(--ink-soft);}
.supbody{padding:22px;}
@media(max-width:560px){.supbody{padding:14px;}}

/* ---------- building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:12px;}
.card--wash{background:var(--tint-wash);border-color:transparent;}
.card h3{font-size:1rem;margin-bottom:9px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.sb{display:flex;justify-content:space-between;gap:10px;align-items:center;}
.grid{display:grid;gap:10px;}
.g2{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
.g3{grid-template-columns:repeat(auto-fit,minmax(146px,1fr));}
.g4{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}
.muted{color:var(--ink-faint);font-size:.8rem;}
.hr{height:1px;background:var(--line-soft);margin:12px 0;}

.stat{background:var(--raised);border:1px solid var(--line-soft);border-radius:11px;padding:12px;}
.stat__v{font-family:var(--serif);font-size:1.45rem;font-weight:600;line-height:1;}
.stat__l{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px;}
.stat__d{margin-top:5px;}

.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;letter-spacing:.03em;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-soft);border:1px solid var(--line-soft);white-space:nowrap;}
.is-good{color:var(--accent-ink);background:var(--accent-wash);border-color:transparent;}
.is-warn{color:var(--amber);background:var(--amber-wash);border-color:transparent;}
.is-bad{color:var(--crimson);background:var(--crimson-wash);border-color:transparent;}
.is-info{color:var(--sky);background:var(--sky-wash);border-color:transparent;}
.is-mute{color:var(--ink-faint);}

.av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font-family:var(--mono);font-size:.7rem;font-weight:600;flex:none;}
.av--sm{width:23px;height:23px;font-size:.58rem;}
.av--lg{width:44px;height:44px;font-size:.88rem;}
.avrow{display:flex;}
.avrow .av{margin-left:-8px;border:2px solid var(--surface);}
.avrow .av:first-child{margin-left:0;}

.bars{display:flex;gap:7px;align-items:flex-end;height:92px;}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;}
.bar b{width:100%;max-width:30px;background:var(--tint);border-radius:5px 5px 0 0;min-height:4px;display:block;opacity:.85;}
.bar em{font-family:var(--mono);font-size:8px;color:var(--ink-faint);font-style:normal;}

.ring{width:96px;height:96px;}
.ring__bg{fill:none;stroke:var(--line);stroke-width:7;}
.ring__fg{fill:none;stroke:var(--tint);stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;}
.ring__t{text-anchor:middle;dominant-baseline:central;font-family:var(--serif);font-weight:600;font-size:15px;fill:var(--ink);}

.field{display:block;margin-bottom:12px;}
.field>span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px;}
.field__in{background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:.9rem;color:var(--ink);}
.field em{font-style:normal;font-size:.72rem;color:var(--ink-faint);display:block;margin-top:4px;}

.tl{position:relative;padding-left:20px;}
.tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl__i{position:relative;padding:0 0 15px;}
.tl__i:last-child{padding-bottom:0;}
.tl__i::before{content:"";position:absolute;left:-18px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--tint);border:2px solid var(--surface);}
.tl__t{font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);}
.tl__b{font-size:.87rem;margin-top:2px;}

.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-family:var(--mono);font-size:9.5px;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-soft);border:1px solid var(--line-soft);}
.chip.on{background:var(--tint);color:var(--on-tint);border-color:var(--tint);}

.list__i{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-soft);}
.list__i:last-child{border-bottom:0;}
.list__i .gr{flex:1;min-width:0;}
.list__i .t{font-size:.88rem;font-weight:500;}
.list__i .s{font-size:.75rem;color:var(--ink-faint);}

.tbl{width:100%;border-collapse:collapse;font-size:.83rem;}
.tbl th{text-align:left;font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;padding:8px 9px;border-bottom:1px solid var(--line);}
.tbl td{padding:10px 9px;border-bottom:1px solid var(--line-soft);}
.tblwrap{overflow-x:auto;}

.qopt{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;font-size:.9rem;background:var(--raised);}
.qopt.sel{border-color:var(--tint);background:var(--tint-wash);}
.qopt i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-faint);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.68rem;font-style:normal;flex:none;}
.qopt.sel i{background:var(--tint);border-color:var(--tint);color:var(--on-tint);}

.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:270px;}
.palette b{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);font-weight:400;}
.palette b.a{background:var(--tint);color:var(--on-tint);border-color:var(--tint);}
.palette b.m{border-color:var(--amber);color:var(--amber);}
.palette b.c{outline:2px solid var(--tint);outline-offset:1px;}

.studio{background:#11171a;color:#e8edeb;padding:14px;min-height:100%;}
.studio h2,.studio h3{color:#f2f6f4;}
.studio .vmain{aspect-ratio:16/9;background:linear-gradient(135deg,#1b2a24,#16212b);border-radius:12px;display:flex;align-items:flex-end;padding:12px;font-size:.8rem;color:#cdd6d3;}
.studio .vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-top:8px;}
.studio .vtile{aspect-ratio:5/4;background:#1c2427;border:1px solid #2b3538;border-radius:10px;display:flex;align-items:flex-end;padding:6px;font-size:.66rem;color:#c0c9c6;}
.studio .dock{background:#161d20;border:1px solid #26302f;border-radius:12px;padding:12px;margin-top:10px;}
.studio .ctrls{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.studio .cbtn{width:38px;height:38px;border-radius:50%;background:#232c2f;border:1px solid #313b3d;display:flex;align-items:center;justify-content:center;color:#dfe6e3;font-size:.8rem;}
.sbar{background:#232c2f;border-radius:6px;height:8px;overflow:hidden;margin:5px 0;}
.sbar b{display:block;height:100%;background:#5CB57C;}

/* ---------- hotspots ---------- */
.hot{cursor:pointer;text-decoration:none;color:inherit;}
.hot--row{display:block;border:1.5px solid color-mix(in srgb,var(--tint) 42%,transparent);border-radius:12px;padding:13px 14px;margin-bottom:9px;background:var(--surface);transition:transform .13s,border-color .13s,background .13s;}
.hot--row:hover{border-color:var(--tint);background:var(--tint-wash);transform:translateY(-1px);}
.hot--card{position:relative;display:block;border:1.5px solid color-mix(in srgb,var(--tint) 42%,transparent);border-radius:13px;padding:15px 40px 15px 15px;margin-bottom:10px;background:var(--surface);transition:transform .13s,border-color .13s,background .13s;}
.hot--card:hover{border-color:var(--tint);background:var(--tint-wash);transform:translateY(-1px);}
.hot--card::after{content:"→";position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--tint);font-weight:700;}

function drawWires(){
 var swim=document.querySelector('.swim'); if(!swim)return;
 var svg=swim.querySelector('.swim__wires'); if(!svg)return;
 var W=swim.scrollWidth,H=swim.scrollHeight;
 svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox','0 0 '+W+' '+H);
 var base=swim.getBoundingClientRect(),nd={};
 [].forEach.call(swim.querySelectorAll('.flownode'),function(n){var r=n.getBoundingClientRect();nd[n.getAttribute('data-fnode')]={x:r.left-base.left,y:r.top-base.top,w:r.width,h:r.height};});
 var d='';
 for(var i=0;i<STEPQ.length-1;i++){
  var a=nd[i],b=nd[i+1]; if(!a||!b)continue;
  if(b.x>=a.x+a.w-6){
   var x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,mx=(x1+x2)/2;
   d+='<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'"/>';
  }else{
   var X1=a.x+a.w/2,Y1=a.y+a.h,X2=b.x+b.w/2,Y2=b.y,my=(Y1+Y2)/2;
   d+='<path d="M'+X1+' '+Y1+' C'+X1+' '+my+' '+X2+' '+my+' '+X2+' '+Y2+'"/>';
  }
 }
 svg.innerHTML=d;
}
window.addEventListener('resize',function(){if(state.view==='flow')drawWires();});

  '<p>Each row is a screen: <b>owner</b> (who is accountable), <b>who</b> sits there, <b>why</b> it exists, <b>how</b> to use it, and <b>when</b> it fires. Dots show which templates turn it on. Rows with a green left edge are the <b>spine</b> (four or more templates). The live practice loop belongs to Exam-prep; the parent portal to K-12 and Music; payouts, metering and audit to Everything. Click a screen name to open it in Everything (full Who / How / When strip).</p></div>'+
  '<div class="tblwrap"><table class="cmptbl"><thead><tr><th>Screen · owner · who · why · how · when</th>'+TEMPLATES.map(function(t){return '<th class="tint-'+t.tint+'" style="color:var(--tint)">'+t.short+'</th>';}).join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
 '</div>';
}

/* ================= about ================= */
function aboutHTML(){
 return '<span class="x" data-close>close ✕</span><h3>About this prototype</h3>'+
  '<p><b>What it is.</b> A clickable mock of TutorOS — '+ALL.length+' screens, organised by the six shipped templates. Nothing saves; buttons and cards navigate. Use it to lock the look and the flow before Figma and the backend.</p>'+
  (ROLE_ONLY?'<p style="margin-top:10px"><b>This file.</b> Role child of <code>tutor-platform-demo.html</code>. Same ids and mocks; only the '+ROLE[ROLE_ONLY].label+' lane. Not linked from the backbone demo.</p>':'')+
  '<p style="margin-top:10px"><b>How it is organised.</b> Start on <b>Template home</b>. Each template opens a <b>horizontal swimlane</b> — Student · Faculty · Admin · Parent · System lanes, left-to-right stages. Click a numbered card to open that screen; the ‹ › bar then walks that template in order. <b>Compare</b> shows which screens each template shares.</p>'+
  '<p style="margin-top:10px"><b>Everything template.</b> That flow is the master gallery. Open any screen there and you get <b>Owner / Who / Why / How / When</b>. <b>Compare all six</b> repeats the same notes on every row, plus which templates turn the screen on. Focused templates hide the strip on mocks so those screens stay the product UI.</p>'+
  '<p style="margin-top:10px"><b>Video is never hosted here.</b> The <b>Session video &amp; transcript</b> screen generates a Google Meet link by default, or takes a Microsoft Teams link. Those two providers only — Zoom and the rest are out of scope. Transcripts are pulled from Google or Microsoft afterwards — see <code>video-and-transcript-options.md</code>.</p>'+
  '<p style="margin-top:10px"><b>Source.</b> Templates, modules and the screen map come from <code>tutor-platform-blueprint.md</code>. The interactive module picker is <code>tutor-platform-explorer.html</code>.</p>'+
  '<p style="margin-top:10px"><b>Next step.</b> Freeze the layouts in Figma as the constant, then build the tenant spine and wire modules to the flow.</p>';
}

/* ================= router + render ================= */
var state={vp:'auto',view:'home',tpl:'t1',cur:null,asRole:null};
try{var v=localStorage.getItem('tos_vp');if(v)state.vp=v;}catch(e){}
try{var tp=localStorage.getItem('tos_tpl');if(tp&&TById(tp))state.tpl=tp;}catch(e){}
document.querySelectorAll('#vpSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.vp===state.vp);});

function urlFor(tid,id){
 var role=stepFor(tid,id).r;
 if(S[id].dom==='G'||['wsetup','branding','roster','cohort-builder'].indexOf(id)>=0)return 'meridian-bio.tutoros.app/setup';
 if(role==='parent')return 'meridian-bio.tutoros.app/family';
 if(role==='admin')return 'meridian-bio.tutoros.app/owner';
 if(role==='faculty')return 'meridian-bio.tutoros.app/teach';
 return 'app.meridian-bio.tutoros.app';
}
function stepFor(tid,id){
 var T=TById(tid);
 var prefer=ROLE_ONLY||(state&&state.asRole)||null;
 if(T && prefer){
  for(var i=0;i<T.steps.length;i++){if(T.steps[i][0]===id&&T.steps[i][1]===prefer)return {r:T.steps[i][1],st:T.steps[i][2]};}
 }
 if(T){
  for(var j=0;j<T.steps.length;j++){if(T.steps[j][0]===id&&!T.steps[j][3])return {r:T.steps[j][1],st:T.steps[j][2]};}
  for(var k=0;k<T.steps.length;k++){if(T.steps[k][0]===id)return {r:T.steps[k][1],st:T.steps[k][2]};}
 }
 return {r:S[id].role,st:'—'};
}
function seqFor(tid,id){var T=TById(tid);if(T&&T.tour.length)return T.tour;return ALL;}
function hdrStrip(tid,id){
 var T=TById(tid),st=stepFor(tid,id),rt=ROLE[st.r];
 return '<div class="scrn__hdr tint-'+rt.tint+'">'+
   '<div class="scrn__crumb">'+
     '<span class="sc__k sc__link" data-goto="home">Template home</span><span class="sc__sep">›</span>'+
     (T?'<span class="sc__k sc__link" data-goto="'+tid+'/flow">'+T.name+'</span><span class="sc__sep">›</span>':'')+
     '<span class="sc__k">'+st.st+'</span><span class="sc__sep">›</span>'+
     '<b>'+S[id].t+'</b>'+
   '</div>'+
   '<div class="scrn__metar">'+
     '<span class="rolebadge">'+rt.label+'</span>'+
     '<span class="modtag">module '+S[id].mod+'</span>'+
     '<span class="sc__flow" data-goto="home">Home</span>'+
     (T?'<span class="sc__flow" data-goto="'+tid+'/flow">↩ flow</span>':'')+
   '</div>'+
 '</div>'+whyPanel(tid,id);
}
function whyPanel(tid,id){
 if(tid!=='t6' && !ROLE_ONLY)return '';
 if(!WHY[id])return '';
 return '<div class="why tint-'+ROLE[stepFor(tid,id).r].tint+'">'+
  '<p class="k">Why this screen · '+(ROLE_ONLY?ROLE[ROLE_ONLY].label:'Everything')+'</p>'+
  '<div class="why__g">'+whyFields(id)+'</div></div>';
}
function flowbar(tid,id){
 var seq=seqFor(tid,id),i=seq.indexOf(id),T=TById(tid);
 var pv=i>0?seq[i-1]:null, nx=(i>=0&&i<seq.length-1)?seq[i+1]:null;
 return '<div class="flowbar">'+
  '<div>'+
    '<span class="prev" data-goto="home">Template home</span>'+
    '<span class="sc__sep">·</span>'+
    (pv?'<span class="prev" data-goto="'+tid+'/'+pv+'">‹ '+S[pv].t+'</span>':'<span class="prev" data-goto="'+tid+'/flow">‹ '+T.name+' flow</span>')+
  '</div>'+
  '<div class="fb__l">'+T.short+' · '+(i>=0?(i+1)+' / '+seq.length:'—')+'</div>'+
  '<div>'+(nx?'<button class="hot hot--btn" data-goto="'+tid+'/'+nx+'">'+S[nx].t+'</button>':'<button class="hot hot--btn" data-goto="'+tid+'/flow">Back to flow</button>')+'</div>'+
 '</div>';
}
function frame(tid,id){
 var m=S[id], body=R[id]?R[id]():'<div style="padding:40px 24px" class="muted">Screen stub — '+id+'</div>';
 var role=stepFor(tid,id).r;
 var autoFrame=(role==='parent'&&(id==='reports'||id==='messages'||id==='notif-prefs'))?'phone':m.frame;
 var vp=state.vp==='auto'?autoFrame:state.vp;
 var tint='tint-'+ROLE[role].tint;
 if(vp==='phone'){
  return '<div class="dev dev--phone '+tint+'"><div class="pstat"><span>9:41</span><span>5G ▪▪▪ 82%</span></div><div class="dev__scr"><div class="phonewrap">'+body+'</div></div>'+flowbar(tid,id)+'</div>';
 }
 return '<div class="dev dev--web '+tint+'"><div class="dev__bar"><span class="dev__dots"><i></i><i></i><i></i></span><span class="dev__url">'+urlFor(tid,id)+'</span></div><div class="dev__scr">'+body+'</div>'+flowbar(tid,id)+'</div>';
}
function buildDrawer(){
 var h='<div class="draw">'+
  '<a data-goto="home">▚ Template home</a>'+
  '<a data-goto="compare">▤ Compare templates</a>'+
  '<div class="hr"></div>'+
  '<div class="draw__grp"><h4>Template flows</h4>'+
  TEMPLATES.map(function(t){return '<a data-goto="'+t.id+'/flow">'+t.name+'<small>'+t.tour.length+' screens · '+t.tier+'</small></a>';}).join('')+
  '</div><div class="hr"></div>';
 [['A','Identity & access'],['B','Teaching & sessions'],['C','Practice & assessment'],['D','Doubts & communication'],['E','Progress & analytics'],['F','Business & operations'],['G','Configuration & templates']].forEach(function(dm){
  h+='<div class="draw__grp"><h4><i>'+dm[0]+'</i>'+dm[1]+'</h4>';
  ALL.filter(function(id){return S[id].dom===dm[0];}).forEach(function(id){h+='<a data-goto="'+id+'">'+S[id].t+'<small>'+ROLE[S[id].role].label+' · '+S[id].mod+'</small></a>';});
  h+='</div>';
 });
 h+='</div>';
 document.getElementById('drawerBody').innerHTML=h;
}
function syncChrome(){
 var lbl=document.getElementById('tlbl'),pv=document.getElementById('pv'),nx=document.getElementById('nx'),sel=document.getElementById('tplSel');
 if(state.view==='home'){lbl.textContent=(ROLE_ONLY?ROLE[ROLE_ONLY].label+' · ':'')+TEMPLATES.length+' templates · '+ALL.length+' screens';pv.disabled=true;nx.disabled=false;sel.value='home';}
 else if(state.view==='compare'){lbl.textContent='compare templates';pv.disabled=false;nx.disabled=true;sel.value='compare';}
 else if(state.view==='flow'){var T=TById(state.tpl);lbl.textContent=T.name+' · flow';pv.disabled=false;nx.disabled=false;sel.value=state.tpl;}
 else{var T2=TById(state.tpl),seq=seqFor(state.tpl,state.cur),i=seq.indexOf(state.cur);lbl.textContent=T2.name+' · '+(i+1)+' / '+seq.length;pv.disabled=false;nx.disabled=false;sel.value=state.tpl;}
 document.querySelectorAll('#drawer a[data-goto]').forEach(function(a){
  var g=a.getAttribute('data-goto');
  var on=(state.view==='home'&&g==='home')||(state.view==='compare'&&g==='compare')||(state.view==='flow'&&g===state.tpl+'/flow')||(state.view==='screen'&&g===state.cur);
  a.classList.toggle('on',on);
 });
 document.querySelectorAll('#vpSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.vp===state.vp);});
}
function render(){
 var h=location.hash.replace(/^#\/?/,''),parts=h.split('/').filter(Boolean);
 var stage=document.getElementById('stage');
 if(!parts.length||parts[0]==='home'){state.view='home';stage.innerHTML=homeView();}
 else if(parts[0]==='compare'){state.view='compare';stage.innerHTML=compareView();}
 else if(/^t[1-6]$/.test(parts[0])&&TById(parts[0])){
  state.tpl=parts[0];try{localStorage.setItem('tos_tpl',state.tpl);}catch(e){}
  if(!parts[1]||parts[1]==='flow'){state.view='flow';state.cur=null;stage.innerHTML=flowView(state.tpl);requestAnimationFrame(function(){requestAnimationFrame(drawWires);});}
  else if(S[parts[1]] && roleHas(parts[1])){state.view='screen';state.cur=parts[1];stage.innerHTML=hdrStrip(state.tpl,parts[1])+frame(state.tpl,parts[1]);}
  else{location.hash='#/'+state.tpl+'/flow';return;}
 }
 else if(S[parts[0]] && roleHas(parts[0])){location.hash='#/'+(TById(state.tpl)?state.tpl:(TEMPLATES[0]&&TEMPLATES[0].id)||'t1')+'/'+parts[0];return;}
 else{location.hash='#/home';return;}
 window.scrollTo(0,0);var sc=stage.querySelector('.dev__scr');if(sc)sc.scrollTop=0;
 syncChrome();
}
function go(t){
 if(t==='home'||t==='compare'){location.hash='#/'+t;return;}
 if(/^t[1-6]$/.test(t)){location.hash='#/'+t+'/flow';return;}
 if(t.indexOf('/')>=0){location.hash='#/'+t;return;}
 location.hash='#/'+(state.tpl||'t1')+'/'+t;
}
window.addEventListener('hashchange',render);

document.getElementById('pv').addEventListener('click',function(){
 if(state.view==='screen'){var seq=seqFor(state.tpl,state.cur),i=seq.indexOf(state.cur);go(state.tpl+'/'+(i>0?seq[i-1]:'flow'));}
 else if(state.view==='flow')go('home');
 else if(state.view==='compare')go('home');
});
document.getElementById('nx').addEventListener('click',function(){
 if(state.view==='screen'){var seq=seqFor(state.tpl,state.cur),i=seq.indexOf(state.cur);go(state.tpl+'/'+(i<seq.length-1?seq[i+1]:'flow'));}
 else if(state.view==='flow'){var T=TById(state.tpl);go(state.tpl+'/'+T.tour[0]);}
 else if(state.view==='home')go((TEMPLATES[0]?TEMPLATES[0].id:'t1')+'/flow');
});
document.getElementById('brandHome').addEventListener('click',function(){go('home');});
document.getElementById('brandTpl').addEventListener('click',function(e){e.stopPropagation();go('home');});
document.getElementById('tplSel').addEventListener('change',function(){var v=this.value;if(v==='home'||v==='compare')go(v);else go(v);});

document.addEventListener('click',function(e){
 var g=e.target.closest('[data-goto]');
 if(g){
  e.preventDefault();closeDrawer();
  if(g.getAttribute('data-as')) state.asRole=g.getAttribute('data-as');
  else if(g.closest('.pnav')) state.asRole='parent';
  else if(g.getAttribute('data-fnode')!=null && STEPQ[g.getAttribute('data-fnode')]) state.asRole=STEPQ[g.getAttribute('data-fnode')][1];
  else {
   var dest=g.getAttribute('data-goto')||'';
   var sid=dest.indexOf('/')>=0?dest.split('/').pop():dest;
   if(S[sid] && !(state.asRole==='parent' && g.closest('.phonewrap'))) state.asRole=stepFor(state.tpl||'t1', sid).r;
   else if(!(state.asRole==='parent' && g.closest('.phonewrap'))) state.asRole=null;
  }
  go(g.getAttribute('data-goto'));return;
 }
 if(e.target.closest('[data-close]')||e.target.id==='modal'){document.getElementById('modal').classList.remove('open');return;}
 if(e.target.id==='aboutBtn2'||e.target.id==='aboutLink'){openAbout();return;}
});

var drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim');
function openDrawer(){drawer.classList.add('open');scrim.classList.add('open');}
function closeDrawer(){drawer.classList.remove('open');scrim.classList.remove('open');}
document.getElementById('burger').addEventListener('click',openDrawer);
scrim.addEventListener('click',closeDrawer);

var hotBtnEl=document.getElementById('hotBtn'),showhot=true;
try{if(localStorage.getItem('tos_hot')==='0')showhot=false;}catch(e){}
function applyHot(){document.body.classList.toggle('showhot',showhot);hotBtnEl.classList.toggle('on',showhot);try{localStorage.setItem('tos_hot',showhot?'1':'0');}catch(e){}}
hotBtnEl.addEventListener('click',function(){showhot=!showhot;applyHot();});

document.getElementById('vpSeg').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 state.vp=b.dataset.vp;try{localStorage.setItem('tos_vp',state.vp);}catch(e){}
 render();
});

function openAbout(){document.getElementById('modalC').innerHTML=aboutHTML();document.getElementById('modal').classList.add('open');}

try{
 if(!localStorage.getItem('tos_seen2')){
  var t=document.getElementById('toast');
  t.textContent='Tip — pick a template, then click the numbered cards in its swimlane. ☰ for every screen.';
  setTimeout(function(){t.classList.add('show');},700);
  setTimeout(function(){t.classList.remove('show');},8000);
  localStorage.setItem('tos_seen2','1');
 }
}catch(e){}

try{
 var qs=new URLSearchParams(location.search).get('screen');
 if(qs && roleHas(qs)){history.replaceState(null,'',location.pathname+'#/'+(TById('t6')?'t6':(TEMPLATES[0]&&TEMPLATES[0].id)||'t1')+'/'+qs);}
}catch(e){}
if(ROLE_ONLY){
 document.title='TutorOS — '+ROLE[ROLE_ONLY].label+' flow';
 var bi=document.querySelector('#top .brand i'); if(bi)bi.textContent=ROLE[ROLE_ONLY].label;
 [].slice.call(document.getElementById('tplSel').options).forEach(function(o){
  if(/^t[1-6]$/.test(o.value)&&!TById(o.value))o.remove();
 });
}
applyTheme();applyHot();buildDrawer();render();
})();
</script>
