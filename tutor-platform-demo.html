<meta charset="utf-8">
<title>TutorOS — 26-Screen Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#F3F6F0; --surface:#FBFCF9; --sunk:#EBEFE6; --raised:#FFFFFF;
  --ink:#182019; --ink-soft:#4C574F; --ink-faint:#7E8A81;
  --line:#D6DCCF; --line-soft:#E4E9DD;
  --accent:#2E7D4F; --accent-ink:#1E5738; --accent-wash:#E4EFE5;
  --amber:#AF6C22; --amber-wash:#F5E9D8;
  --crimson:#A4384A; --crimson-wash:#F3E0E1;
  --sky:#2C6C88; --sky-wash:#DDEAEE;
  --violet:#6A4C93; --violet-wash:#E9E2F1;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(24,32,25,.04), 0 12px 34px -12px rgba(24,32,25,.18);
  --tint:var(--accent); --tint-wash:var(--accent-wash);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C110E; --surface:#171E19; --sunk:#10150F; --raised:#1E251F;
    --ink:#E6ECE3; --ink-soft:#A4AEA4; --ink-faint:#6C776E;
    --line:#26302A; --line-soft:#1D251F;
    --accent:#5CB57C; --accent-ink:#8CD3A5; --accent-wash:#173224;
    --amber:#D3944F; --amber-wash:#332413;
    --crimson:#D06E7A; --crimson-wash:#331A1E;
    --sky:#6BA7C2; --sky-wash:#122831;
    --violet:#A98FD6; --violet-wash:#241C33;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0C110E; --surface:#171E19; --sunk:#10150F; --raised:#1E251F;
  --ink:#E6ECE3; --ink-soft:#A4AEA4; --ink-faint:#6C776E;
  --line:#26302A; --line-soft:#1D251F;
  --accent:#5CB57C; --accent-ink:#8CD3A5; --accent-wash:#173224;
  --amber:#D3944F; --amber-wash:#332413;
  --crimson:#D06E7A; --crimson-wash:#331A1E;
  --sky:#6BA7C2; --sky-wash:#122831;
  --violet:#A98FD6; --violet-wash:#241C33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;}
p{margin:0;}
button{font-family:inherit;}
::selection{background:var(--accent-wash);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}
.k{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);}
#top .brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:600;font-size:15px;cursor:pointer;}
#top .brand svg{width:19px;height:19px;}
#top .brand i{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-style:normal;}
.burger{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex:none;}
.tnav{display:flex;align-items:center;gap:8px;margin:0 auto;font-family:var(--mono);font-size:11px;color:var(--ink-soft);}
.tnav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:26px;height:26px;cursor:pointer;color:var(--ink-soft);}
.tnav button:disabled{opacity:.35;cursor:default;}
.tnav .lbl{min-width:150px;text-align:center;}
.right{display:flex;align-items:center;gap:7px;flex:none;}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:31px;padding:0 10px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;}
.iconbtn:hover{border-color:var(--ink-faint);color:var(--ink);}
.iconbtn.on{background:var(--accent-wash);color:var(--accent-ink);border-color:transparent;}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;}
.seg button{border:0;background:var(--surface);padding:0 10px;height:31px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);cursor:pointer;}
.seg button.on{background:var(--ink);color:var(--ground);}
@media(max-width:820px){.tnav .lbl{display:none;}.iconbtn .lbl{display:none;}.iconbtn{padding:0 8px;}}

/* ---------- drawer ---------- */
#drawer{position:fixed;top:0;left:0;bottom:0;width:312px;max-width:86vw;background:var(--surface);border-right:1px solid var(--line);z-index:60;transform:translateX(-103%);transition:transform .22s ease;overflow-y:auto;padding:16px 14px 40px;}
#drawer.open{transform:none;}
#drawer .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
#drawer .dh b{font-family:var(--serif);font-size:1rem;}
#scrim{position:fixed;inset:0;background:rgba(10,14,11,.36);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s;}
#scrim.open{opacity:1;pointer-events:auto;}
.draw__grp{margin-bottom:13px;}
.draw__grp h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 5px;display:flex;gap:7px;align-items:center;}
.draw__grp h4 i{width:17px;height:17px;border-radius:5px;background:var(--tint-wash);color:var(--tint);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;font-weight:700;}
.draw a{display:block;padding:7px 9px;border-radius:8px;font-size:.85rem;color:var(--ink-soft);cursor:pointer;}
.draw a:hover{background:var(--sunk);}
.draw a.on{background:var(--tint-wash);color:var(--tint);font-weight:600;}
.draw a small{display:block;font-size:.7rem;color:var(--ink-faint);font-weight:400;}

/* ---------- stage + device ---------- */
#stage{padding:26px 20px 64px;max-width:1240px;margin:0 auto;}
@media(max-width:560px){#stage{padding:14px 9px 48px;}}
.dev{margin:0 auto;background:var(--raised);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-width:100%;}
.dev--web{max-width:1180px;}
.dev--phone{max-width:406px;border-radius:42px;padding:10px;background:#0d120f;border-color:#0d120f;}
.dev__bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line-soft);}
.dev__dots{display:flex;gap:6px;}
.dev__dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block;}
.dev__url{flex:1;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);background:var(--ground);border:1px solid var(--line-soft);border-radius:999px;padding:3px 12px;text-align:center;max-width:380px;margin:0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dev__scr{background:var(--ground);height:min(660px,82vh);overflow-y:auto;overflow-x:hidden;position:relative;}
.dev--phone .dev__scr{height:min(620px,80vh);}
@media(max-width:560px){.dev__scr{height:min(600px,78vh);}}
.phonewrap{min-height:100%;display:flex;flex-direction:column;}
.phonewrap>.appwrap{flex:1 0 auto;}
.pstat{display:flex;align-items:center;justify-content:space-between;padding:9px 22px 8px;font-family:var(--mono);font-size:10px;color:var(--ink-soft);background:var(--surface);}
.dev--phone .pstat{border-radius:30px 30px 0 0;}
.dev--phone .flowbar{border-radius:0 0 30px 30px;}

/* tint hooks */
.tint-amber{--tint:var(--amber);--tint-wash:var(--amber-wash);}
.tint-accent{--tint:var(--accent);--tint-wash:var(--accent-wash);}
.tint-sky{--tint:var(--sky);--tint-wash:var(--sky-wash);}
.tint-violet{--tint:var(--violet);--tint-wash:var(--violet-wash);}

/* ---------- app chrome (phone) ---------- */
.appbar{display:flex;align-items:center;gap:10px;padding:15px 16px 12px;background:var(--tint-wash);}
.appbar h2{font-size:1.1rem;flex:1;}
.appwrap{padding:14px 16px 6px;}
.appnav{display:flex;background:var(--surface);border-top:1px solid var(--line);}
.appnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;font-family:var(--mono);font-size:7.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);cursor:pointer;}
.appnav a.on{color:var(--tint);}
.appnav svg{width:17px;height:17px;}

/* ---------- console chrome (web) ---------- */
.cons{display:grid;grid-template-columns:198px 1fr;min-height:520px;}
.cons__side{background:var(--surface);border-right:1px solid var(--line-soft);padding:14px 10px;display:flex;flex-direction:column;gap:2px;}
.cons__side a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:.83rem;color:var(--ink-soft);cursor:pointer;}
.cons__side a:hover{background:var(--sunk);}
.cons__side a.on{background:var(--tint-wash);color:var(--tint);font-weight:600;}
.cons__side svg{width:15px;height:15px;flex:none;}
.cons__main{padding:20px 22px;min-width:0;}
.cons__main>h2{font-size:1.3rem;margin-bottom:3px;}
.cons__main>.k{margin-bottom:16px;display:block;}
.dev--phone .cons{grid-template-columns:1fr;}
.dev--phone .cons__side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line-soft);padding:8px;}
.dev--phone .cons__side a span{display:none;}
.dev--phone .cons__main{padding:14px;}

/* ---------- setup chrome ---------- */
.suphead{padding:16px 22px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);}
.wm{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:600;}
.wm i{font-family:var(--mono);font-size:7.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-style:normal;}
.steps{font-family:var(--mono);font-size:10px;color:var(--ink-faint);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.steps .on{color:var(--tint);font-weight:600;}
.steps .done{color:var(--ink-soft);}
.supbody{padding:22px;}
@media(max-width:560px){.supbody{padding:14px;}}

/* ---------- building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:12px;}
.card--wash{background:var(--tint-wash);border-color:transparent;}
.card h3{font-size:1rem;margin-bottom:9px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.sb{display:flex;justify-content:space-between;gap:10px;align-items:center;}
.grid{display:grid;gap:10px;}
.g2{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
.g3{grid-template-columns:repeat(auto-fit,minmax(146px,1fr));}
.g4{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}
.muted{color:var(--ink-faint);font-size:.8rem;}
.hr{height:1px;background:var(--line-soft);margin:12px 0;}

.stat{background:var(--raised);border:1px solid var(--line-soft);border-radius:11px;padding:12px;}
.stat__v{font-family:var(--serif);font-size:1.45rem;font-weight:600;line-height:1;}
.stat__l{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px;}
.stat__d{margin-top:5px;}

.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;letter-spacing:.03em;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-soft);border:1px solid var(--line-soft);white-space:nowrap;}
.is-good{color:var(--accent-ink);background:var(--accent-wash);border-color:transparent;}
.is-warn{color:var(--amber);background:var(--amber-wash);border-color:transparent;}
.is-bad{color:var(--crimson);background:var(--crimson-wash);border-color:transparent;}
.is-info{color:var(--sky);background:var(--sky-wash);border-color:transparent;}
.is-mute{color:var(--ink-faint);}

.av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font-family:var(--mono);font-size:.7rem;font-weight:600;flex:none;}
.av--sm{width:23px;height:23px;font-size:.58rem;}
.av--lg{width:44px;height:44px;font-size:.88rem;}
.avrow{display:flex;}
.avrow .av{margin-left:-8px;border:2px solid var(--surface);}
.avrow .av:first-child{margin-left:0;}

.bars{display:flex;gap:7px;align-items:flex-end;height:92px;}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;}
.bar b{width:100%;max-width:30px;background:var(--tint);border-radius:5px 5px 0 0;min-height:4px;display:block;opacity:.85;}
.bar em{font-family:var(--mono);font-size:8px;color:var(--ink-faint);font-style:normal;}

.ring{width:96px;height:96px;}
.ring__bg{fill:none;stroke:var(--line);stroke-width:7;}
.ring__fg{fill:none;stroke:var(--tint);stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;}
.ring__t{text-anchor:middle;dominant-baseline:central;font-family:var(--serif);font-weight:600;font-size:15px;fill:var(--ink);}

.field{display:block;margin-bottom:12px;}
.field>span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px;}
.field__in{background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:.9rem;color:var(--ink);}
.field em{font-style:normal;font-size:.72rem;color:var(--ink-faint);display:block;margin-top:4px;}

.tl{position:relative;padding-left:20px;}
.tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl__i{position:relative;padding:0 0 15px;}
.tl__i:last-child{padding-bottom:0;}
.tl__i::before{content:"";position:absolute;left:-18px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--tint);border:2px solid var(--surface);}
.tl__t{font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);}
.tl__b{font-size:.87rem;margin-top:2px;}

.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-family:var(--mono);font-size:9.5px;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-soft);border:1px solid var(--line-soft);}
.chip.on{background:var(--tint);color:#fff;border-color:var(--tint);}

.list__i{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-soft);}
.list__i:last-child{border-bottom:0;}
.list__i .gr{flex:1;min-width:0;}
.list__i .t{font-size:.88rem;font-weight:500;}
.list__i .s{font-size:.75rem;color:var(--ink-faint);}

.tbl{width:100%;border-collapse:collapse;font-size:.83rem;}
.tbl th{text-align:left;font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;padding:8px 9px;border-bottom:1px solid var(--line);}
.tbl td{padding:10px 9px;border-bottom:1px solid var(--line-soft);}
.tblwrap{overflow-x:auto;}

.qopt{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;font-size:.9rem;background:var(--raised);}
.qopt.sel{border-color:var(--tint);background:var(--tint-wash);}
.qopt i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-faint);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.68rem;font-style:normal;flex:none;}
.qopt.sel i{background:var(--tint);border-color:var(--tint);color:#fff;}

.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:270px;}
.palette b{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);font-weight:400;}
.palette b.a{background:var(--tint);color:#fff;border-color:var(--tint);}
.palette b.m{border-color:var(--amber);color:var(--amber);}
.palette b.c{outline:2px solid var(--tint);outline-offset:1px;}

.studio{background:#11171a;color:#e8edeb;padding:14px;min-height:100%;}
.studio h2,.studio h3{color:#f2f6f4;}
.studio .vmain{aspect-ratio:16/9;background:linear-gradient(135deg,#1b2a24,#16212b);border-radius:12px;display:flex;align-items:flex-end;padding:12px;font-size:.8rem;color:#cdd6d3;}
.studio .vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-top:8px;}
.studio .vtile{aspect-ratio:5/4;background:#1c2427;border:1px solid #2b3538;border-radius:10px;display:flex;align-items:flex-end;padding:6px;font-size:.66rem;color:#c0c9c6;}
.studio .dock{background:#161d20;border:1px solid #26302f;border-radius:12px;padding:12px;margin-top:10px;}
.studio .ctrls{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.studio .cbtn{width:38px;height:38px;border-radius:50%;background:#232c2f;border:1px solid #313b3d;display:flex;align-items:center;justify-content:center;color:#dfe6e3;font-size:.8rem;}
.sbar{background:#232c2f;border-radius:6px;height:8px;overflow:hidden;margin:5px 0;}
.sbar b{display:block;height:100%;background:#5CB57C;}

/* ---------- hotspots (the only real interaction) ---------- */
.hot{cursor:pointer;text-decoration:none;color:inherit;}
.hot--row{display:block;border:1.5px solid color-mix(in srgb,var(--tint) 42%,transparent);border-radius:12px;padding:13px 14px;margin-bottom:9px;background:var(--surface);transition:transform .13s,border-color .13s,background .13s;}
.hot--row:hover{border-color:var(--tint);background:var(--tint-wash);transform:translateY(-1px);}
.hot--card{position:relative;display:block;border:1.5px solid color-mix(in srgb,var(--tint) 42%,transparent);border-radius:13px;padding:15px 40px 15px 15px;margin-bottom:10px;background:var(--surface);transition:transform .13s,border-color .13s,background .13s;}
.hot--card:hover{border-color:var(--tint);background:var(--tint-wash);transform:translateY(-1px);}
.hot--card::after{content:"→";position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--tint);font-weight:700;}
.hot--btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;background:var(--tint);color:#fff;border:none;font-family:var(--sans);font-weight:600;font-size:.88rem;cursor:pointer;transition:filter .13s;}
.hot--btn:hover{filter:brightness(1.07);}
.hot--btn::after{content:"→";}
.hot--btn.ghost{background:transparent;color:var(--tint);border:1.5px solid color-mix(in srgb,var(--tint) 45%,transparent);}
:root[data-theme="dark"] .hot--btn:not(.ghost),:root:not([data-theme="light"]) .hot--btn:not(.ghost){color:#0c130e;}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .hot--btn:not(.ghost){color:#fff;}}
.hot--link{border-bottom:2px solid var(--tint);color:var(--tint);cursor:pointer;font-weight:600;}
body.showhot .hot--row,body.showhot .hot--card{box-shadow:0 0 0 3px var(--tint-wash);}
body.showhot .hot--btn{box-shadow:0 0 0 4px var(--tint-wash);}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:.8rem;font-family:var(--sans);cursor:default;}
.btn--dark{background:var(--ink);color:var(--ground);border-color:var(--ink);}
.btn--sm{padding:6px 10px;font-size:.74rem;}

.flowbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--sunk);border-top:2px dashed var(--line);}
.flowbar>div{min-width:0;display:flex;align-items:center;}
.flowbar>div:first-child{flex:1;}
.flowbar>div:last-child{flex:none;}
.flowbar .fb__l{font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);text-align:center;flex:none;padding:0 6px;}
.flowbar .prev{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.flowbar .prev:hover{color:var(--ink);}
.flowbar .hot--btn{white-space:nowrap;padding:9px 14px;font-size:.82rem;}
@media(max-width:440px){.flowbar .fb__l{display:none;}}

/* ---------- map ---------- */
.mapwrap{max-width:1180px;margin:0 auto;}
.maphero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:20px;box-shadow:var(--shadow);}
.maphero h1{font-size:clamp(1.5rem,3vw,2.15rem);letter-spacing:-.02em;margin:10px 0 12px;}
.maphero h1 em{font-style:italic;color:var(--accent-ink);}
.maphero p{color:var(--ink-soft);max-width:64ch;}
.maphero .row{margin-top:18px;}
.mapmeta{margin-top:14px;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:14px;}
.mapcol{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}
.mapcol__h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--line-soft);}
.mapcol__h i{width:20px;height:20px;border-radius:6px;background:var(--tint-wash);color:var(--tint);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.68rem;font-weight:700;font-style:normal;flex:none;}
.mapchip{display:block;padding:9px 10px;border-radius:9px;border:1px solid var(--line-soft);margin-bottom:6px;cursor:pointer;transition:border-color .13s,background .13s;}
.mapchip:last-child{margin-bottom:0;}
.mapchip:hover{border-color:var(--tint);background:var(--tint-wash);}
.mapchip b{display:block;font-size:.83rem;}
.mapchip span{display:block;font-size:.71rem;color:var(--ink-faint);margin-top:1px;}

/* ---------- modal + toast ---------- */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,14,11,.42);}
.modal.open{display:flex;}
.modal__c{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:580px;width:100%;padding:24px;max-height:84vh;overflow-y:auto;box-shadow:var(--shadow);}
.modal__c h3{font-size:1.2rem;margin-bottom:12px;}
.modal__c p,.modal__c li{font-size:.86rem;color:var(--ink-soft);line-height:1.55;}
.modal__c ul{padding-left:18px;margin:8px 0;}
.modal__c .x{float:right;cursor:pointer;color:var(--ink-faint);font-family:var(--mono);font-size:.8rem;}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(18px);background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:10px;font-size:.8rem;z-index:65;opacity:0;transition:opacity .3s,transform .3s;max-width:92vw;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%);}

@media(max-width:560px){
  .cons{grid-template-columns:1fr;}
  .cons__side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line-soft);}
  .cons__side a span{display:none;}
  .cons__main{padding:14px;}
}
